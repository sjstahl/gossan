[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gossan"
version = "0.1.0"
description = "Internal tool for SJS Geospatial Analytics: claim polygons and legacy files to client-ready deliverables."
requires-python = ">=3.11"
dependencies = [
    "typer",
    "pydantic",
    "pyyaml",
    "geopandas",
    "shapely",
    "pyogrio",
    "rasterio",
    "rioxarray",
    "python-docx",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
gossan = "gossan.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/gossan"]

[tool.ruff]
src = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# affine/rasterio emit this on every raster operation; it is third-party noise
filterwarnings = ["ignore::PendingDeprecationWarning"]
