[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gossan"
version = "0.1.0"
description = "Internal tool for SJS Geospatial Analytics: claim polygons and legacy files to client-ready deliverables."
requires-python = ">=3.11"
dependencies = [
    "typer",
    "pydantic",
    "pyyaml",
    "geopandas",
    "shapely",
    "pyogrio",
    "rasterio",
    "rioxarray",
    "python-docx",
    "matplotlib",
    # AGPL-3.0 / commercial dual licence (flagged for review; fine for internal use)
    "pymupdf",
    "pdfplumber",
    "anthropic",
    "opencv-python-headless",
    "scikit-learn",
    "scipy",
    "pyproj",
]

[project.optional-dependencies]
# EasyOCR (Apache-2.0) pulls in PyTorch (BSD-3), which is several GB: opt in with gossan[ocr]
ocr = ["easyocr"]
dev = ["pytest", "ruff"]

[project.scripts]
gossan = "gossan.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/gossan"]

[tool.ruff]
src = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# affine/rasterio emit this on every raster operation; it is third-party noise
filterwarnings = [
    "ignore::PendingDeprecationWarning",
    "ignore::rasterio.errors.NotGeoreferencedWarning",  # test images are plain, unreferenced rasters
]
